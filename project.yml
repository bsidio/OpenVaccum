# Generate the Xcode project with: xcodegen
name: OpenVacuum
options:
  bundleIdPrefix: io.github.bsidio
  deploymentTarget:
    iOS: "17.0"
targets:
  OpenVacuum:
    type: application
    platform: iOS
    sources: [Valetudo]
    info:
      path: Valetudo/Info.plist
      properties:
        CFBundleDisplayName: OpenVacuum
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: This app finds and controls your Valetudo robot on your home network.
        UIRequiresFullScreen: true
        NSBonjourServices: [_valetudo._tcp]
        ITSAppUsesNonExemptEncryption: false
        # Robots are plain HTTP, often on custom LAN hostnames such as robot.lan.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bsidio.openvacuum
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Valetudo/Vendor/Valetudo-Bridging-Header.h
  OpenVacuumTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ValetudoTests]
    dependencies:
      - target: OpenVacuum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  OpenVacuum:
    build:
      targets:
        OpenVacuum: all
    test:
      targets: [OpenVacuumTests]
